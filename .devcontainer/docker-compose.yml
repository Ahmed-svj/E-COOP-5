services:
  app:
    image: mcr.microsoft.com/devcontainers/php:1-8.3-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on: [db]
  db:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - coop-mysql:/var/lib/mysql
volumes:
  coop-mysql:
